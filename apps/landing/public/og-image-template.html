<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1200" />
    <style>
      * { margin: 0; padding: 0; box-sizing: border-box; }

      body {
        width: 1200px;
        height: 630px;
        overflow: hidden;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        background: #301B69;
      }

      .bg {
        position: absolute;
        inset: 0;
        background: linear-gradient(135deg, #1a0d3d 0%, #301B69 45%, #5a2fa0 100%);
      }

      /* Soft glow blobs */
      .blob1 {
        position: absolute;
        width: 600px;
        height: 600px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(176,124,209,0.25) 0%, transparent 70%);
        top: -200px;
        right: -100px;
      }
      .blob2 {
        position: absolute;
        width: 400px;
        height: 400px;
        border-radius: 50%;
        background: radial-gradient(circle, rgba(80,40,160,0.4) 0%, transparent 70%);
        bottom: -150px;
        left: -100px;
      }

      /* Grid lines */
      .grid {
        position: absolute;
        inset: 0;
        background-image:
          linear-gradient(rgba(255,255,255,0.04) 1px, transparent 1px),
          linear-gradient(90deg, rgba(255,255,255,0.04) 1px, transparent 1px);
        background-size: 60px 60px;
      }

      .content {
        position: relative;
        z-index: 10;
        display: flex;
        flex-direction: column;
        justify-content: center;
        height: 100%;
        padding: 64px 80px;
      }

      .logo {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 48px;
      }

      .logo-icon {
        width: 48px;
        height: 48px;
        border-radius: 12px;
        background: linear-gradient(135deg, #B07CD1, #6a35b0);
        display: flex;
        align-items: center;
        justify-content: center;
      }

      .logo-icon svg {
        width: 28px;
        height: 28px;
        fill: white;
      }

      .logo-name {
        font-size: 32px;
        font-weight: 700;
        color: white;
        letter-spacing: -0.5px;
      }

      .tagline {
        font-size: 56px;
        font-weight: 800;
        color: white;
        line-height: 1.1;
        letter-spacing: -1.5px;
        margin-bottom: 28px;
        max-width: 700px;
      }

      .tagline span {
        background: linear-gradient(90deg, #d4a8f0, #B07CD1);
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
      }

      .sub {
        font-size: 22px;
        color: rgba(255,255,255,0.65);
        line-height: 1.5;
        max-width: 580px;
        margin-bottom: 48px;
      }

      .pills {
        display: flex;
        gap: 12px;
        flex-wrap: wrap;
      }

      .pill {
        display: flex;
        align-items: center;
        gap: 8px;
        background: rgba(255,255,255,0.1);
        border: 1px solid rgba(255,255,255,0.15);
        border-radius: 100px;
        padding: 10px 20px;
        color: white;
        font-size: 16px;
        font-weight: 500;
        backdrop-filter: blur(8px);
      }

      .pill-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        background: #B07CD1;
      }

      /* Right side card */
      .card {
        position: absolute;
        right: 72px;
        top: 50%;
        transform: translateY(-50%);
        width: 340px;
        background: rgba(255,255,255,0.08);
        border: 1px solid rgba(255,255,255,0.12);
        border-radius: 20px;
        padding: 28px;
        backdrop-filter: blur(16px);
      }

      .card-title {
        font-size: 14px;
        font-weight: 600;
        color: rgba(255,255,255,0.5);
        text-transform: uppercase;
        letter-spacing: 1px;
        margin-bottom: 20px;
      }

      .card-item {
        display: flex;
        align-items: center;
        gap: 14px;
        padding: 12px 0;
        border-bottom: 1px solid rgba(255,255,255,0.07);
      }

      .card-item:last-child {
        border-bottom: none;
      }

      .card-icon {
        width: 36px;
        height: 36px;
        border-radius: 10px;
        background: linear-gradient(135deg, rgba(176,124,209,0.3), rgba(90,47,160,0.3));
        border: 1px solid rgba(176,124,209,0.3);
        display: flex;
        align-items: center;
        justify-content: center;
        flex-shrink: 0;
        font-size: 17px;
      }

      .card-text {
        color: rgba(255,255,255,0.85);
        font-size: 15px;
        font-weight: 500;
      }

      .domain {
        position: absolute;
        bottom: 40px;
        right: 80px;
        font-size: 16px;
        color: rgba(255,255,255,0.35);
        font-weight: 500;
      }
    </style>
  </head>
  <body>
    <div class="bg"></div>
    <div class="blob1"></div>
    <div class="blob2"></div>
    <div class="grid"></div>

    <div class="content">
      <!-- Logo -->
      <div class="logo">
        <div class="logo-icon">
          <!-- Brain / agent icon -->
          <svg viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
            <path d="M12 2C8.13 2 5 5.13 5 9c0 2.38 1.19 4.47 3 5.74V17c0 .55.45 1 1 1h6c.55 0 1-.45 1-1v-2.26C17.81 13.47 19 11.38 19 9c0-3.87-3.13-7-7-7zm-1 15v-1h2v1h-2zm3-2.46l-.5.28V16h-3v-1.18l-.5-.28C8.42 13.37 7 11.28 7 9c0-2.76 2.24-5 5-5s5 2.24 5 5c0 2.28-1.42 4.37-3 5.54z"/>
          </svg>
        </div>
        <span class="logo-name">Agenvik</span>
      </div>

      <!-- Headline -->
      <div class="tagline">
        Build AI Agents<br/>from Your <span>Knowledge</span>
      </div>

      <!-- Subtext -->
      <p class="sub">
        Turn documents, FAQs & data into powerful AI agents.<br/>
        No code required. Deploy anywhere.
      </p>

      <!-- Feature pills -->
      <div class="pills">
        <div class="pill"><div class="pill-dot"></div>Web Chat</div>
        <div class="pill"><div class="pill-dot"></div>WhatsApp</div>
        <div class="pill"><div class="pill-dot"></div>Slack</div>
        <div class="pill"><div class="pill-dot"></div>No Code</div>
      </div>
    </div>

    <!-- Right card -->
    <div class="card">
      <div class="card-title">What you can build</div>
      <div class="card-item">
        <div class="card-icon">🎧</div>
        <span class="card-text">Customer Support Bot</span>
      </div>
      <div class="card-item">
        <div class="card-icon">📚</div>
        <span class="card-text">Study Assistant</span>
      </div>
      <div class="card-item">
        <div class="card-icon">🏢</div>
        <span class="card-text">Internal Knowledge Agent</span>
      </div>
      <div class="card-item">
        <div class="card-icon">🚀</div>
        <span class="card-text">Product Assistant</span>
      </div>
    </div>

    <span class="domain">agenvik.com</span>
  </body>
</html>
