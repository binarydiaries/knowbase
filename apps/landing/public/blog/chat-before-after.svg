<svg viewBox="0 0 760 520" xmlns="http://www.w3.org/2000/svg" font-family="Inter, -apple-system, sans-serif">
  <title>Before vs After: How Agenvik handles mid-flow questions</title>
  <desc>Left panel shows V1 losing context after an off-topic question. Right panel shows V2 maintaining state and resuming the flow.</desc>

  <!-- Background -->
  <rect width="760" height="520" fill="#f8f7fc" rx="12"/>

  <!-- LEFT PANEL -->
  <rect x="16" y="16" width="358" height="488" fill="#ffffff" rx="10" stroke="#e2dff0" stroke-width="1.2"/>
  <rect x="16" y="16" width="358" height="44" fill="#f3f0fa" rx="10"/>
  <rect x="16" y="44" width="358" height="16" fill="#f3f0fa"/>
  <text x="36" y="43" font-size="13" font-weight="600" fill="#64537a">Before</text>
  <text x="36" y="57" font-size="11" fill="#9985b5">No persistent memory</text>

  <rect x="120" y="78" width="234" height="34" fill="#301B69" rx="8"/>
  <text x="237" y="97" font-size="11.5" fill="#fff" text-anchor="middle">I'm interested. My name is Rahul.</text>

  <rect x="36" y="122" width="210" height="34" fill="#ede9f8" rx="8"/>
  <text x="141" y="141" font-size="11.5" fill="#301B69" text-anchor="middle">Great! What's your email address?</text>

  <rect x="170" y="166" width="184" height="34" fill="#301B69" rx="8"/>
  <text x="262" y="185" font-size="11.5" fill="#fff" text-anchor="middle">rahul@example.com</text>

  <rect x="144" y="210" width="210" height="34" fill="#301B69" rx="8"/>
  <text x="249" y="229" font-size="11.5" fill="#fff" text-anchor="middle">By the way, what's the price?</text>

  <rect x="36" y="254" width="210" height="34" fill="#ede9f8" rx="8"/>
  <text x="141" y="273" font-size="11.5" fill="#301B69" text-anchor="middle">Our plan starts at ₹999/month.</text>

  <line x1="36" y1="302" x2="354" y2="302" stroke="#e2dff0" stroke-width="1" stroke-dasharray="4,3"/>

  <rect x="36" y="314" width="278" height="48" fill="#fff3f3" rx="8" stroke="#fca5a5" stroke-width="1"/>
  <text x="175" y="333" font-size="11" fill="#b91c1c" text-anchor="middle">Agent forgot the lead flow.</text>
  <text x="175" y="349" font-size="11" fill="#b91c1c" text-anchor="middle">Rahul's details are lost.</text>

  <rect x="36" y="372" width="234" height="48" fill="#ede9f8" rx="8"/>
  <text x="153" y="391" font-size="11.5" fill="#301B69" text-anchor="middle">How can I help you today?</text>
  <text x="153" y="408" font-size="10.5" fill="#7c6fa0" text-anchor="middle">(starts over — lead never saved)</text>

  <circle cx="339" cy="388" r="14" fill="#fee2e2"/>
  <text x="339" y="394" font-size="16" fill="#dc2626" text-anchor="middle">✕</text>

  <!-- RIGHT PANEL -->
  <rect x="386" y="16" width="358" height="488" fill="#ffffff" rx="10" stroke="#e2dff0" stroke-width="1.2"/>
  <rect x="386" y="16" width="358" height="44" fill="#edf9f0" rx="10"/>
  <rect x="386" y="44" width="358" height="16" fill="#edf9f0"/>
  <text x="406" y="43" font-size="13" font-weight="600" fill="#166534">After</text>
  <text x="406" y="57" font-size="11" fill="#4ade80">State persists across every turn</text>

  <rect x="490" y="78" width="234" height="34" fill="#301B69" rx="8"/>
  <text x="607" y="97" font-size="11.5" fill="#fff" text-anchor="middle">I'm interested. My name is Rahul.</text>

  <rect x="406" y="122" width="210" height="34" fill="#ede9f8" rx="8"/>
  <text x="511" y="141" font-size="11.5" fill="#301B69" text-anchor="middle">Great! What's your email address?</text>

  <rect x="540" y="166" width="184" height="34" fill="#301B69" rx="8"/>
  <text x="632" y="185" font-size="11.5" fill="#fff" text-anchor="middle">rahul@example.com</text>

  <rect x="514" y="210" width="210" height="34" fill="#301B69" rx="8"/>
  <text x="619" y="229" font-size="11.5" fill="#fff" text-anchor="middle">By the way, what's the price?</text>

  <rect x="406" y="254" width="210" height="34" fill="#ede9f8" rx="8"/>
  <text x="511" y="273" font-size="11.5" fill="#301B69" text-anchor="middle">Our plan starts at ₹999/month.</text>

  <rect x="406" y="296" width="164" height="22" fill="#dcfce7" rx="5"/>
  <text x="488" y="311" font-size="10" fill="#166534" text-anchor="middle">✓ name + email held in memory</text>

  <rect x="406" y="328" width="258" height="48" fill="#ede9f8" rx="8"/>
  <text x="535" y="347" font-size="11.5" fill="#301B69" text-anchor="middle">Happy to help! Now, could I get</text>
  <text x="535" y="364" font-size="11.5" fill="#301B69" text-anchor="middle">your phone number?</text>

  <rect x="406" y="386" width="306" height="48" fill="#f0fdf4" rx="8" stroke="#86efac" stroke-width="1"/>
  <text x="559" y="405" font-size="11" fill="#166534" text-anchor="middle">All fields collected. Lead saved.</text>
  <text x="559" y="421" font-size="11" fill="#166534" text-anchor="middle">Notification sent. ✓</text>

  <circle cx="709" cy="408" r="14" fill="#dcfce7"/>
  <text x="709" y="414" font-size="16" fill="#16a34a" text-anchor="middle">✓</text>

  <text x="380" y="510" font-size="10.5" fill="#9985b5" text-anchor="middle">Agenvik V2 — powered by LangGraph</text>
</svg>
