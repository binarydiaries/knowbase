<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title description">
  <title id="title">Agenvik</title>
  <desc id="description">Build AI agents grounded in your knowledge. Connect documents to a conversation pipeline and deploy across web, WhatsApp, and Slack.</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#F6F2FF"/>
      <stop offset="1" stop-color="#E8E1FF"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="360" rx="24" fill="url(#background)"/>
  <circle cx="1150" cy="0" r="215" fill="#D8C9FF" opacity=".45"/>
  <circle cx="1100" cy="355" r="150" fill="#E0D4FF" opacity=".5"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#301B69">
    <text x="58" y="100" font-size="20" letter-spacing="4" font-weight="700">AGENVIK</text>
    <text x="56" y="160" font-size="42" font-weight="700">Your knowledge.</text>
    <text x="56" y="211" font-size="42" font-weight="700">An agent that puts it to work.</text>
    <text x="58" y="255" font-size="18" fill="#655286">Knowledge-grounded answers. Connected conversations.</text>
    <g font-size="14" font-weight="700">
      <rect x="58" y="285" width="79" height="31" rx="15" fill="#301B69"/>
      <text x="97" y="306" text-anchor="middle" fill="white">WEB</text>
      <rect x="148" y="285" width="125" height="31" rx="15" fill="#301B69"/>
      <text x="210" y="306" text-anchor="middle" fill="white">WHATSAPP</text>
      <rect x="284" y="285" width="90" height="31" rx="15" fill="#301B69"/>
      <text x="329" y="306" text-anchor="middle" fill="white">SLACK</text>
    </g>
    <g transform="translate(775 70)">
      <rect width="348" height="222" rx="18" fill="#FFF" stroke="#D7CCEB"/>
      <text x="25" y="40" font-size="13" font-weight="700" letter-spacing="1.5" fill="#8068A3">FROM CONTEXT TO CONVERSATION</text>
      <rect x="25" y="62" width="298" height="40" rx="10" fill="#F2EDFC"/>
      <text x="174" y="87" text-anchor="middle" font-size="16">Documents · FAQs · Websites</text>
      <path d="M174 109v20m-5-5 5 5 5-5" fill="none" stroke="#AD99CD" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
      <rect x="25" y="139" width="298" height="58" rx="10" fill="#301B69"/>
      <text x="174" y="174" text-anchor="middle" font-size="18" font-weight="700" fill="#FFF">Your AI agent</text>
    </g>
  </g>
</svg>
