name: Release checks
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    container: oven/bun:1.4.3
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_PASSWORD: synthetic-ci-password
          POSTGRES_DB: agenvik_test
        options: >-
          --health-cmd "pg_isready -U postgres -d agenvik_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
      redis:
        image: redis:7-alpine
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:synthetic-ci-password@postgres:5432/agenvik_test
      TEST_DATABASE_URL: postgresql://postgres:synthetic-ci-password@postgres:5432/agenvik_test
      TEST_REDIS_URL: redis://redis:6379
      TURBO_TELEMETRY_DISABLED: '1'
      ASTRO_TELEMETRY_DISABLED: '1'
      LANDING_URL: https://agenvik.com
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: bun install --frozen-lockfile --ignore-scripts
      - run: bun run check-types
      - run: bun run --cwd apps/backend db:migrate
      - run: bun run test
      - run: bun run build
      - run: bun audit
  secrets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0
      - name: Scan Git history
        run: >-
          docker run --rm --network none -v "$PWD:/repo:ro"
          ghcr.io/gitleaks/gitleaks:v8.30.1
          git /repo --config /repo/.gitleaks.toml --log-opts=--all --redact=100 --no-banner
